monitor = ,1920x1080@120,auto,1

$browser = librewolf 
$terminal = ghostty

exec-once = sleep 2 && ags run -g 4
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 2 silent] $browser
exec-once = hyprpaper

general {
    gaps_in = 3
    gaps_out = 10

    border_size = 1 

    col.active_border = rgba(141,141,141,1)
    col.inactive_border = rgba(5959592a)

    resize_on_border = false

    layout = master
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
            range = 4
            render_power = 3
            color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
            size = 3
            passes = 1
            brightness = 0.4

            vibrancy = 1
    }
}

xwayland {
    enabled = true
    force_zero_scaling = true
}

cursor {
    no_warps = true
    inactive_timeout = 5
}

animations {
    enabled = no, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.12, almostLinear, slide
}

dwindle {
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
        disable_hyprland_logo = true 
}

input {
    kb_layout = us, ru
    kb_options = grp:alt_shift_toggle

    repeat_delay = 600
    repeat_rate = 0

    follow_mouse = 2
    accel_profile = flat

    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe_forever = true
    workspace_swipe_direction_lock = false
    workspace_swipe_distance = 125
}

gesture = 3, horizontal, workspace

env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = STARSHIP_CONFIG,~/.config/starship/starship.toml
env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland:xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = GTK_USE_PORTAL,1
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1
env = ELECTRON_OZONE_PLATFROM_HINT,auto
env = NVD_BACKEND,direct
env = EDITOR,nvim
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

$mainMod = SUPER 

bind = $mainMod SHIFT, R, exec, ags quit; ags run -g 4
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $file_manager
bind = $mainMod, V, togglefloating,
bind = $mainMod, G, exec, hyprshot -m window
bind = $mainMod, R, exec, ags toggle app-launcher
bind = $mainMod, F, exec, ags toggle power-off-menu
# bind = $mainMod, W, exec, ags toggle wifi-chooser
bind = $mainMod, T, exec, /home/mgik/.scripts/hypr/turn_off_touchpad.sh
bind = $mainMod SHIFT, L, exec, hyprlock;

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod SHIFT, S, movetoworkspace, 

bind = $mainMod, N, workspace, e+1
bind = $mainMod, P, workspace, e-1

bind = , XF86Calculator, exec, rofi -show calc

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

$volume_level_cmd = wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%.0f\n", $2 * 100}'
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+; notify-send Volume $(eval $volume_level_cmd)%
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; notify-send Volume $(eval $volume_level_cmd)%
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; 
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

$brightness_level_cmd = brightnessctl | tail -n3 | head -n1 | awk '{print $4}'
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+; notify-send Brightness $(eval $brightness_level_cmd)
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-; notify-send Brightness $(eval $brightness_level_cmd)

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bindr = $mainMod SHIFT, SHIFT_R, layoutmsg, rollnext
bindr = $mainMod SHIFT, SHIFT_L, layoutmsg, rollprev

windowrule = suppress_event maximize, match:class .*, 

windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 1, match:pin 1
windowrule = no_initial_focus 1, match:class jetbrains-toolbox, match:float 1
windowrule = no_initial_focus 1, match:class (jetbrains-)(.*), match:title ^$, match:initial_title ^$, match:float 1
windowrule = center 1, match:class (jetbrains-)(.*), match:title ^$, match:initial_title ^$, match:float 1
windowrule = no_initial_focus 1, match:class (jetbrains-)(.*), match:float 1
windowrule = float 1 , match:title ^(.*Network Manager.*)$
